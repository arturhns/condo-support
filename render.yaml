# Blueprint Render — Web Service + Postgres (item "nuvem" da ementa PJI240).
# Dashboard: New → Blueprint → conectar o repositório com este arquivo.
databases:
  - name: condoagenda-db
    plan: free

services:
  - type: web
    name: condoagenda
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /contas/entrar/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: condoagenda-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: PORT
        value: "8000"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: anymail.backends.sendgrid.EmailBacken
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
